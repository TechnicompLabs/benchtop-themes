# Once a day, moves each package to its upstream's newest release (or, for
# projects without releases, newest commit), by running the packages'
# update.sh scripts, and commits the changed specs. The push reaches OBS
# through the organization's webhook (.obs/workflows.yml), and OBS then
# downloads the new sources (remote assets) and rebuilds.
name: Follow upstream
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the specs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > "$RUNNER_TEMP/message"
          for script in */update.sh; do
            if ! ./"$script" >> "$RUNNER_TEMP/message"; then
              echo "::warning::$script failed"
            fi
          done
      - name: Commit and push
        run: |
          [ -s "$RUNNER_TEMP/message" ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- */*.spec
          git commit -q -F "$RUNNER_TEMP/message"
          git push
